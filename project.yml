name: Marginalia

options:
  bundleIdPrefix: com.jenish
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  Marginalia:
    type: application
    platform: iOS
    sources:
      - Marginalia
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jenish.marginalia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Marginalia/Info.plist
      properties:
        CFBundleDisplayName: Marginalia
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UIUserInterfaceStyle: Dark
        # Exposes Documents/ (annotated exports) in Files › On My iPad › Marginalia.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.jenish.marginalia
            CFBundleURLSchemes: [marginalia]
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf

  MarginaliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MarginaliaTests
    dependencies:
      - target: Marginalia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MarginaliaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MarginaliaUITests
    dependencies:
      - target: Marginalia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Marginalia
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  Marginalia:
    build:
      targets:
        Marginalia: all
        MarginaliaTests: [test]
        MarginaliaUITests: [test]
    test:
      targets:
        - MarginaliaTests
        - MarginaliaUITests
